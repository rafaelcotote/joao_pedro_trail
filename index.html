<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>João Pedro: Trail Quest</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #111218;
    color: #f5f5eb;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #59bfff;
    outline: none;
    touch-action: none;
  }
  .controls {
    display: none;
    width: min(100vw, 640px);
    gap: 10px;
    padding: 8px 12px 14px;
    box-sizing: border-box;
  }
  .pad {
    flex: 1;
    text-align: center;
    font: 700 16px/1 "Courier New", ui-monospace, monospace;
    letter-spacing: 1px;
    color: #111218;
    background: #ffd02d;
    border: 4px solid #111218;
    box-shadow: inset 0 -4px 0 #e0981e;
    padding: 18px 8px;
    touch-action: none;
  }
  #duck {
    background: #43cdee;
    box-shadow: inset 0 -4px 0 #2ea4eb;
  }
  @media (pointer: coarse), (max-width: 800px) {
    .controls { display: flex; }
  }
</style>
</head>
<body>
<canvas id="game" width="320" height="180" tabindex="0" aria-label="João Pedro: Trail Quest"></canvas>
<div class="controls" id="controls">
  <div class="pad" id="duck" role="button">AGACHAR</div>
  <div class="pad" id="jump" role="button">PULAR</div>
</div>
<script src="game.js"></script>
</body>
</html>
